name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad con Bandit
        run: bandit -r . --exclude .git

      - name: Ejecutar pruebas Python
        run: pytest

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-and-security

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          no-cache: true
          provenance: false
          sbom: false
          tags: angie11/cristian-api:v2

      - name: Verificar dependencias de la imagen API
        run: |
          docker run --rm angie11/cristian-api:v2 pip show msgpack
          docker run --rm angie11/cristian-api:v2 pip show setuptools

      - name: Escanear API con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "angie11/cristian-api:v2"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Construir imagen Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          no-cache: true
          provenance: false
          sbom: false
          tags: angie11/cristian-frontend:v2

      - name: Escanear Frontend con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "angie11/cristian-frontend:v2"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Subir imagen API a Docker Hub
        run: docker push angie11/cristian-api:v2

      - name: Subir imagen Frontend a Docker Hub
        run: docker push angie11/cristian-frontend:v2

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/despliegue
            docker compose pull
            docker compose up -d

# Workflow actualizado






