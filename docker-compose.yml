services:
  nginx:
    build: ./frontend
    container_name: proxy_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
     app_backend:
      condition: service_healthy
    networks:
      - red-cba
    
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red-cba
    depends_on:
     servidor-bd:
      condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: .
    env_file:
      - .env
    ports:
      - "5050:5050"
    networks:
      - red-cba
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  red-cba: